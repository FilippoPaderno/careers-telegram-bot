name: GitHub Actions Keepalive

on:
  schedule:
    # Esegue il controllo il 1° di ogni mese alle 06:00 UTC
    - cron: '0 6 1 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prevenzione disattivazione cron dopo 60 giorni
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git add .github/keepalive.txt
          git commit -m "chore: keepalive automatico per preservare il cron [skip ci]" || echo "Nessun cambiamento"
          git push
