name: Microsoft Careers Monitor

on:
  schedule:
    # Esecuzione automatica ogni 30 minuti (modificabile a piacere)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permette di avviare il monitor manualmente con un clic da GitHub

concurrency:
  group: ms-careers-monitor
  cancel-in-progress: false

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessario per fare il commit automatico di data/seen_jobs.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurazione ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esecuzione monitor Microsoft Careers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_LOCATION: ${{ vars.SEARCH_LOCATION || 'Italy' }}
          SEARCH_SENIORITY: ${{ vars.SEARCH_SENIORITY || 'Intern' }}
          SEARCH_QUERY: ${{ vars.SEARCH_QUERY || '' }}
        run: |
          python -m src.main

      - name: Salvataggio automatico dello stato (Git Commit & Push)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/seen_jobs.json ] && git status --porcelain data/seen_jobs.json | grep -q .; then
            git add data/seen_jobs.json
            git commit -m "chore(state): aggiornamento storico annunci visti [skip ci]"
            git push
            echo "Stato sincronizzato con successo sul repository."
          else
            echo "Nessun cambiamento nello stato locale."
          fi
